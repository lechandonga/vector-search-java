# 向量维度约定：RAW 与 TEXT 来源的向量都必须等于该维度
vector.service.dimension=128
# 持久化目录（WAL + 检查点）
vector.service.data-dir=data/vectorstore
# 资源上限：库内容许的最大对象数，达到后按写入拒绝处理
vector.service.max-vectors=100000
# 检索资源上限：通过过滤后的最大候选数
vector.service.search-max-candidates=10000
# 候选超限时的策略：REJECT 直接拒绝；DEGRADE 确定性截断并标记 degraded
vector.service.search-over-cap-policy=DEGRADE
# 重建相关保留配置（毫秒，预留）
vector.service.rebuild-tombstone-retention-ms=86400000
# 每多少次变更落一次检查点（崩溃恢复重放量上界）
vector.service.checkpoint-after-ops=200
