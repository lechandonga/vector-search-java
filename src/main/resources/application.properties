# ============================================================================
# 向量检索服务配置
# 向量维度：TEXT 派生向量与 RAW 写入都必须与该维度一致（维度约定见 README）
vector-search.dimension=${VECTOR_SEARCH_DIMENSION:64}
# 存活对象数硬上限：达到后写入/导入按 RESOURCE_LIMIT_REACHED 拒绝
vector-search.max-objects=${VECTOR_SEARCH_MAX_OBJECTS:100000}
# 单次查询允许参与打分的最大候选数（资源上限）
vector-search.max-query-candidates=${VECTOR_SEARCH_MAX_QUERY_CANDIDATES:10000}
# 达到候选上限时的策略：REJECT（拒绝查询）或 DEGRADE（在上限内返回并标记 degraded=true）
vector-search.query-limit-policy=${VECTOR_SEARCH_QUERY_POLICY:DEGRADE}
# WAL 数据目录：进程重启后据此恢复（恢复语义见 README）
vector-search.data-dir=${VECTOR_SEARCH_DATA_DIR:./data/vector-search}

spring.application.name=vector-search-java

# 日志：时间 级别 线程名（并发时序分析需要） logger 消息
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.level.com.github.lechandonga=INFO
# 为跨分页快照查询保留的历史不可变索引版本数（同时是版本链压实深度）
vector-search.retained-versions=${VECTOR_SEARCH_RETAINED_VERSIONS:8}

# ----------------------------------------------------------------------------
# 可续跑导出会话（export session）
# 导出快照与会话事件保存在 ${data-dir}/exports 下，独立于主 WAL，可跨重启续跑
# 绝对保留期（毫秒）：自发起时刻起，超过后会话失效（默认 24h）
vector-search.export.ttl-ms=${VECTOR_SEARCH_EXPORT_TTL_MS:86400000}
# 空闲保留期（毫秒）：最后一次取页后超过该时长未访问则失效；<=0 表示不限（默认 2h）
vector-search.export.idle-timeout-ms=${VECTOR_SEARCH_EXPORT_IDLE_TIMEOUT_MS:7200000}
# 同时存在的活跃导出会话数上限，到顶拒绝新发起（EXPORT_SESSION_LIMIT）
vector-search.export.max-active-sessions=${VECTOR_SEARCH_EXPORT_MAX_SESSIONS:100}
# 单次导出绑定快照的最大记录数，超过拒绝（EXPORT_TOO_LARGE）；<=0 不限
vector-search.export.max-records-per-session=${VECTOR_SEARCH_EXPORT_MAX_RECORDS:10000000}
# 单个导出快照文件字节上限，超过拒绝（EXPORT_STORAGE_LIMIT）；<=0 不限（默认 512MB）
vector-search.export.max-bytes-per-session=${VECTOR_SEARCH_EXPORT_MAX_BYTES:536870912}
# 全部导出快照总占用字节上限；<=0 不限（默认 10GB）
vector-search.export.max-total-bytes=${VECTOR_SEARCH_EXPORT_MAX_TOTAL_BYTES:10737418240}
# 取页默认页大小 / 单次取页最大页大小
vector-search.export.default-page-size=${VECTOR_SEARCH_EXPORT_DEFAULT_PAGE_SIZE:500}
vector-search.export.max-page-size=${VECTOR_SEARCH_EXPORT_MAX_PAGE_SIZE:10000}
# 后台过期扫描周期（毫秒）
vector-search.export.sweep-interval-ms=${VECTOR_SEARCH_EXPORT_SWEEP_INTERVAL_MS:60000}
